<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="100%" height="100%">
  <!-- Upward Trendline Arc with Endpoint Dots -->
  <g id="growth-curve">
    <path 
      d="M 116 200 C 175 190, 240 160, 400 48" 
      fill="none" 
      stroke="#CBD5E1" 
      stroke-width="9.5" 
      stroke-linecap="round"
      opacity="0.85"
    />
    <circle cx="116" cy="200" r="6.5" fill="#94A3B8" />
    <circle cx="400" cy="48" r="7" fill="#94A3B8" />
  </g>

  <!-- INDSTATE Brand Name -->
  <text 
    x="250" 
    y="136" 
    font-family="system-ui, -apple-system, 'Outfit', 'Montserrat', 'Inter', sans-serif" 
    font-size="65" 
    font-weight="900" 
    fill="#1B3679" 
    letter-spacing="-0.5" 
    text-anchor="middle"
  >INDSTATE</text>

  <!-- Tagline -->
  <text 
    x="250" 
    y="166" 
    font-family="system-ui, -apple-system, 'Outfit', 'Montserrat', 'Inter', sans-serif" 
    font-size="11.5" 
    font-weight="800" 
    fill="#1B3679" 
    letter-spacing="4.5" 
    text-anchor="middle"
  >INDIA'S TRUSTED PROPERTY MARKETPLACE</text>
</svg>
