  <text x="62" y="29" font-family="'Inter', sans-serif" font-size="18" font-weight="900" fill="#004C8F" letter-spacing="0.5">HDFC BANK</text>
  <text x="62" y="43" font-family="'Inter', sans-serif" font-size="8.5" font-weight="700" fill="#ED232A" letter-spacing="1.2">We understand your world</text>
